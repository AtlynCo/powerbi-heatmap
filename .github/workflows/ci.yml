name: Visual validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: npm audit
      - run: npm run package -- --certification-audit
      - run: npm run audit:package
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: atlyn-heatmap-candidate
          path: |
            dist/*.pbiviz
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packaged-browser-failure-evidence
          path: test-results/
